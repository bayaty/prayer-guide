name: Release

# Publishes a GitHub Release with an APK whenever the version in
# pubspec.yaml changes on main. Pushes that don't touch the version
# are skipped, so ordinary commits don't create duplicate releases.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Skip if this tag already exists
        id: check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists. Nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        if: steps.check.outputs.exists == 'false'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      # The release build is signed with the debug key (see
      # android/app/build.gradle.kts). Restoring the same keystore used
      # locally keeps the signature stable, so in-app updates install
      # over existing builds instead of failing on a signature mismatch.
      - name: Restore signing keystore
        if: steps.check.outputs.exists == 'false'
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 secret is not set. APKs would be signed"
            echo "::error::with a different key and could not install over existing builds."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          echo "Keystore restored ($(stat -c%s ~/.android/debug.keystore) bytes)."

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: flutter pub get

      - name: Analyze
        if: steps.check.outputs.exists == 'false'
        run: flutter analyze

      - name: Run tests
        if: steps.check.outputs.exists == 'false'
        run: flutter test

      - name: Build release APKs
        if: steps.check.outputs.exists == 'false'
        # Universal for anything, plus per-architecture builds. A phone only
        # needs its own architecture, so the arm64 file is roughly a third of
        # the universal one and installs far more quickly.
        run: |
          flutter build apk --release --dart-define=COFFEE_LINK=https://buy.stripe.com/7sYaEZ91DeyB2cT371ao800
          flutter build apk --release --split-per-abi --dart-define=COFFEE_LINK=https://buy.stripe.com/7sYaEZ91DeyB2cT371ao800

      - name: Verify the APK signature
        if: steps.check.outputs.exists == 'false'
        run: |
          EXPECTED="acbd534465cfdf47e1e00c0b5b73f2453f3e4857dabe0d8fbe9430e4b5789ba1"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          # Every APK we publish must carry the same signature, or an update
          # cannot install over an existing build.
          for apk in build/app/outputs/flutter-apk/app-release.apk \
                     build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
                     build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
                     build/app/outputs/flutter-apk/app-x86_64-release.apk; do
            ACTUAL=$("$APKSIGNER" verify --print-certs "$apk" \
              | grep -m1 -i "SHA-256 digest" | awk '{print $NF}')
            echo "$(basename "$apk"): $ACTUAL"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::Signature mismatch in $(basename "$apk")."
              exit 1
            fi
          done
          echo "All signatures match."

      - name: Name the APKs
        if: steps.check.outputs.exists == 'false'
        run: |
          OUT=build/app/outputs/flutter-apk
          # Versioned copies for the archive, plus stable names so a single
          # permanent URL always points at the newest build.
          cp "$OUT/app-release.apk" \
             "prayer-guide-${{ steps.version.outputs.version }}.apk"
          cp "$OUT/app-release.apk" "prayer-guide.apk"
          # Phones are almost always arm64, so give that one a plain name.
          cp "$OUT/app-arm64-v8a-release.apk" "prayer-guide-phone.apk"
          cp "$OUT/app-arm64-v8a-release.apk" "prayer-guide-arm64.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "prayer-guide-arm32.apk"
          ls -lh prayer-guide*.apk

      - name: Create the GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "prayer-guide-${{ steps.version.outputs.version }}.apk" \
            "prayer-guide.apk" \
            "prayer-guide-phone.apk" \
            "prayer-guide-arm64.apk" \
            "prayer-guide-arm32.apk" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
